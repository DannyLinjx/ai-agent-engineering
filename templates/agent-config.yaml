version: "1.0"
agent:
  id: "{{AGENT_ID}}"
  name: "{{AGENT_NAME}}"
  mode: "durable-agent"
  instructions_file: "config/agent-instructions.md"
runtime:
  max_steps: 24
  max_replans: 4
  task_timeout_seconds: 900
  tool_timeout_seconds: 60
  max_consecutive_failures: 3
  max_repeated_actions: 2
  token_budget: 100000
  cost_budget_usd: 5.0
  checkpoint_after_tool: true
context:
  max_input_tokens: 64000
  reserved_output_tokens: 4096
  tool_output_artifact_bytes: 12000
  compaction_trigger_ratio: 0.8
permissions:
  default: "ask"
  policy_file: "config/permission-policy.yaml"
  approval_timeout_seconds: 900
integrations:
  config_file: "config/integrations.config.json"
  allow_unconfigured_optional: true
tools:
  manifest: "config/tool-manifest.json"
  allow: ["read_file", "search_files", "apply_patch", "exec_command", "run_tests"]
skills:
  roots: ["skills"]
  lazy: true
memory:
  enabled: false
  profile: "local"
  canonical_store: "sqlite"
  keyword_index: "sqlite_fts5"
  vector_index: "none"
  graph_store: "none"
  framework: "native"
  database_url: "sqlite:///data/memory.db"
  credential_ref: null
  markdown_mode: "export_import_proposals"
  require_consent: true
  retention_days: 90
  authorization_before_ranking: true
storage:
  url: "sqlite:///data/agent.db"
  artifact_root: ".artifacts"
telemetry:
  redact_secrets: true
  audit_enabled: true
  service_name: "{{AGENT_ID}}"
